name: Fix PDF selector UI
on:
  push:
    branches: [feature/pdf-toolkit-compression]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-toolkit-compression
      - name: Replace native PDF selector
        run: |
          echo '' | base64 -d > /tmp/patch_pdf_selector.py
          python /tmp/patch_pdf_selector.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pdf-toolkit/page.tsx
          git commit -m "Improve PDF working-file selector UX"
          git push origin HEAD:feature/pdf-toolkit-compression
