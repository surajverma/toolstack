name: Fix PDF.js 6 API usage
on:
  push:
    branches: [feature/pdf-toolkit-compression]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-toolkit-compression
      - name: Patch PDF.js API usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pdf-toolkit/page.tsx')
          s = p.read_text()
          s = s.replace(
            "await page.render({ canvasContext: context, viewport, background: '#ffffff' }).promise;",
            "await page.render({ canvas, canvasContext: context, viewport, background: '#ffffff' }).promise;"
          )
          s = s.replace("await source.destroy();", "await loadingTask.destroy();")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pdf-toolkit/page.tsx
          git commit -m "Fix PDF.js 6 rendering API usage"
          git push origin HEAD:feature/pdf-toolkit-compression
