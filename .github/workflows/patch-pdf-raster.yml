name: Patch PDF raster compression
on:
  push:
    branches: [feature/pdf-toolkit-compression]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-toolkit-compression
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only
      - name: Patch PDF toolkit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/pdf-toolkit/page.tsx')
          text = path.read_text()

          text = text.replace(
              "const MAX_COMPRESSION_BYTES = 100 * 1024 * 1024;",
              "const MAX_COMPRESSION_BYTES = 100 * 1024 * 1024;\nconst MAX_RASTER_PAGES = 150;\nconst MAX_RASTER_PAGE_PIXELS = 20_000_000;\nconst MAX_RASTER_TOTAL_PIXELS = 220_000_000;"
          )

          old_args = re.compile(r"function compressionArgs\(mode: CompressionMode\) \{.*?\n\}\n\nexport default", re.S)
          new_args = r'''function losslessCompressionArgs() {
            return [
              '--compress-streams=y',
              '--decode-level=generalized',
              '--recompress-flate',
              '--compression-level=9',
              '--object-streams=generate',
              '--',
              'input.pdf',
              'output.pdf',
            ];
          }

          function rasterSettings(mode: Exclude<CompressionMode, 'lossless'>) {
            return mode === 'balanced'
              ? { dpi: 150, jpegQuality: 0.72 }
              : { dpi: 96, jpegQuality: 0.52 };
          }

          function canvasToJpeg(canvas: HTMLCanvasElement, quality: number) {
            return new Promise<Uint8Array>((resolve, reject) => {
              canvas.toBlob(async blob => {
                if (!blob) {
                  reject(new Error('The browser could not encode a compressed PDF page.'));
                  return;
                }
                resolve(new Uint8Array(await blob.arrayBuffer()));
              }, 'image/jpeg', quality);
            });
          }

          async function rasterCompressPdf(
            file: File,
            mode: Exclude<CompressionMode, 'lossless'>,
            onProgress: (current: number, total: number) => void,
          ) {
            const pdfjs = await import('pdfjs-dist/build/pdf.mjs');
            pdfjs.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.mjs';

            const input = new Uint8Array(await file.arrayBuffer());
            const loadingTask = pdfjs.getDocument({ data: input });
            const source = await loadingTask.promise;
            const { dpi, jpegQuality } = rasterSettings(mode);

            try {
              if (source.numPages > MAX_RASTER_PAGES) {
                throw new Error(`Balanced/Strong compression is limited to ${MAX_RASTER_PAGES} pages. Use Lossless for larger documents.`);
              }

              const output = await PDFDocument.create();
              let totalPixels = 0;

              for (let pageNumber = 1; pageNumber <= source.numPages; pageNumber++) {
                onProgress(pageNumber, source.numPages);
                const page = await source.getPage(pageNumber);
                const baseViewport = page.getViewport({ scale: 1 });
                let scale = dpi / 72;
                const projectedPixels = baseViewport.width * scale * baseViewport.height * scale;

                if (projectedPixels > MAX_RASTER_PAGE_PIXELS) {
                  scale *= Math.sqrt(MAX_RASTER_PAGE_PIXELS / projectedPixels);
                }

                const viewport = page.getViewport({ scale });
                const width = Math.max(1, Math.ceil(viewport.width));
                const height = Math.max(1, Math.ceil(viewport.height));
                totalPixels += width * height;

                if (totalPixels > MAX_RASTER_TOTAL_PIXELS) {
                  throw new Error('Balanced/Strong compression would require too much browser memory. Split this PDF or use Lossless mode.');
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const context = canvas.getContext('2d', { alpha: false });
                if (!context) throw new Error('Canvas rendering is unavailable in this browser.');
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, width, height);

                await page.render({ canvasContext: context, viewport, background: '#ffffff' }).promise;
                const jpeg = await canvasToJpeg(canvas, jpegQuality);
                const image = await output.embedJpg(jpeg);
                const outputPage = output.addPage([baseViewport.width, baseViewport.height]);
                outputPage.drawImage(image, { x: 0, y: 0, width: baseViewport.width, height: baseViewport.height });
                page.cleanup();
                canvas.width = 1;
                canvas.height = 1;
              }

              return await output.save({ useObjectStreams: true });
            } finally {
              await source.destroy();
            }
          }

          export default'''
          text, count = old_args.subn(new_args, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace compression argument block')

          text = text.replace(
              "  const [compressionResult, setCompressionResult] = useState<CompressionResult | null>(null);",
              "  const [compressionResult, setCompressionResult] = useState<CompressionResult | null>(null);\n  const [compressionStatus, setCompressionStatus] = useState('');"
          )

          compress_block = re.compile(r"  const compressPdf = async \(workingPdf: PdfInfo\) => \{.*?\n  \};\n\n  const imagesToPdf", re.S)
          new_compress = r'''  const compressPdf = async (workingPdf: PdfInfo) => {
            if (workingPdf.file.size > MAX_COMPRESSION_BYTES) {
              setMessage('For browser stability, compression is limited to PDFs up to 100 MB.');
              return;
            }

            setBusy(true);
            setMessage('');
            setCompressionResult(null);
            setCompressionStatus(compressionMode === 'lossless' ? 'Optimizing PDF structure…' : 'Preparing pages…');

            try {
              const input = new Uint8Array(await workingPdf.file.arrayBuffer());
              let output: Uint8Array;

              if (compressionMode === 'lossless') {
                const { createQpdfRunner } = await import('qpdf-run');
                const runner = await createQpdfRunner({
                  workerUrl: '/qpdf/worker.js',
                  qpdfJsUrl: '/qpdf/qpdf.js',
                  wasmUrl: '/qpdf/qpdf.wasm',
                  timeoutMs: 90000,
                });

                try {
                  output = await runner.runOne({
                    input,
                    inputName: 'input.pdf',
                    outputName: 'output.pdf',
                    args: losslessCompressionArgs(),
                  });
                } finally {
                  await runner.destroy();
                }
              } else {
                output = await rasterCompressPdf(
                  workingPdf.file,
                  compressionMode,
                  (current, total) => setCompressionStatus(`Rendering page ${current} of ${total}…`),
                );
              }

              const downloaded = output.byteLength < input.byteLength;
              setCompressionResult({ original: input.byteLength, compressed: output.byteLength, downloaded });

              if (downloaded) {
                downloadBytes(output, `${baseName(workingPdf.file.name)}-compressed.pdf`);
              } else {
                setMessage('This PDF is already compact enough that the selected mode did not produce a smaller file. No larger copy was downloaded.');
              }
            } catch (err) {
              const error = err as Error & { stderr?: string[] };
              const detail = Array.isArray(error.stderr) && error.stderr.length
                ? `${error.message} — ${error.stderr.slice(-2).join(' ')}`
                : error.message || String(err);
              setMessage(`Compression failed: ${detail}`);
            } finally {
              setCompressionStatus('');
              setBusy(false);
            }
          };

          const imagesToPdf'''
          text, count = compress_block.subn(new_compress, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace compressPdf block')

          old_help = """  const compressionHelp = compressionMode === 'lossless'\n    ? 'Recompresses compatible streams and PDF structure without intentionally reducing image quality. Best first choice for normal documents.'\n    : compressionMode === 'balanced'\n      ? 'Includes image optimization at JPEG quality 75 when qpdf can make supported images smaller. Text remains text, but some images may become lossy.'\n      : 'Uses stronger JPEG quality 50 image optimization when possible. Best for size reduction when some image-quality loss is acceptable.';"""
          new_help = """  const compressionHelp = compressionMode === 'lossless'\n    ? 'Recompresses compatible streams and PDF structure without intentionally reducing image quality. Selectable text, links, forms and document structure are preserved.'\n    : compressionMode === 'balanced'\n      ? 'Renders each page at about 150 DPI and rebuilds the PDF with JPEG pages. Usually much smaller for scans, but selectable text, links, forms, bookmarks, accessibility structure and signatures are removed.'\n      : 'Renders each page at about 96 DPI with stronger JPEG compression. Best for small email/upload files when reduced sharpness and flattened pages are acceptable.';"""
          if old_help not in text:
              raise SystemExit('Could not find compression help block')
          text = text.replace(old_help, new_help)

          text = text.replace(
              "<p className='mt-1 text-sm text-slate-500'>Compression runs locally with qpdf WebAssembly. Searchable/selectable text is preserved; ToolStack does not rasterize every page into an image.</p>",
              "<p className='mt-1 text-sm text-slate-500'>All compression stays in your browser. Lossless preserves document structure; Balanced and Strong deliberately flatten pages for much larger reductions on scanned or image-heavy PDFs.</p>"
          )
          text = text.replace("<option value='balanced'>Balanced image optimization</option>", "<option value='balanced'>Balanced · 150 DPI (flatten pages)</option>")
          text = text.replace("<option value='strong'>Stronger image optimization</option>", "<option value='strong'>Strong · 96 DPI (flatten pages)</option>")
          text = text.replace(
              "        <button disabled={busy} onClick={() => void compressPdf(workingPdf)} className='mt-4 rounded bg-emerald-600 px-4 py-2 font-semibold text-white disabled:opacity-40'>{busy ? 'Working…' : `Compress ${workingPdf.file.name}`}</button>",
              "        <button disabled={busy} onClick={() => void compressPdf(workingPdf)} className='mt-4 rounded bg-emerald-600 px-4 py-2 font-semibold text-white disabled:opacity-40'>{busy ? 'Working…' : `Compress ${workingPdf.file.name}`}</button>\n        {compressionStatus && <p className='mt-3 text-sm text-slate-600' aria-live='polite'>{compressionStatus}</p>}"
          )
          text = text.replace(
              "Lossless compression mainly optimizes PDF structure and streams, so an already-efficient or image-heavy PDF may shrink only a little. Balanced/strong modes can use lossy JPEG recompression for supported images.",
              "Lossless compression mainly optimizes PDF structure and streams, so an already-efficient or image-heavy PDF may shrink only a little. Balanced/Strong modes flatten every page into a JPEG-backed page, so text selection, links, forms, bookmarks, accessibility structure and digital signatures are not preserved."
          )

          path.write_text(text)
          PY
      - name: Commit patch and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pdf-toolkit/page.tsx package-lock.json
          git commit -m "Use PDF.js for reliable lossy PDF compression"
          git push origin HEAD:feature/pdf-toolkit-compression
