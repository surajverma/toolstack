name: Refresh feature lockfile
on:
  push:
    branches: [feature/privacy-toolstack-refresh]
    paths:
      - '.github/workflows/update-feature-deps.yml'
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/privacy-toolstack-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh npm lockfile for Next 16 active LTS
        run: npm install --package-lock-only
      - name: Report production dependency audit
        run: npm audit --omit=dev || true
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dependency lockfile"
            git push origin HEAD:feature/privacy-toolstack-refresh
          fi
