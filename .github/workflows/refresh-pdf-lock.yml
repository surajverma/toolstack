name: Refresh PDF dependency lockfile

on:
  push:
    branches:
      - feature/pdf-toolkit-compression
    paths:
      - package.json
      - .github/workflows/refresh-pdf-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-toolkit-compression
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh PDF compression dependency lockfile"
            git push origin HEAD:feature/pdf-toolkit-compression
          fi
