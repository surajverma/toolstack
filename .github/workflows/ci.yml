name: Verify ToolStack
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run privacy-check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
